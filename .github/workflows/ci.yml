name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      inject_integration_failure:
        description: Inject a deterministic integration failure after environment startup
        required: false
        default: false
        type: boolean
      inject_integration_timeout:
        description: Hold after environment startup until the integration step times out
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up minimum supported Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Verify minimum Python installation and backend
        run: |
          python scripts/check_python.py
          python -m venv /tmp/gitferry-minimum-python
          /tmp/gitferry-minimum-python/bin/pip install --disable-pip-version-check '.[dev]'
          /tmp/gitferry-minimum-python/bin/pip check
          PYTHONPATH=backend/src /tmp/gitferry-minimum-python/bin/pytest backend/tests -q
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13.9"
          cache: pip
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Set up project
        run: make setup
      - name: Install browser test runtime
        run: cd frontend && npx playwright install --with-deps chromium
      - name: Run environment doctor
        run: make doctor
      - name: Run unit tests
        run: make test
      - name: Run browser authentication tests
        timeout-minutes: 5
        run: make test-browser
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitferry-browser-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Build container
        run: make container-build

  gitea-integration:
    runs-on: ubuntu-24.04
    # The job bound deliberately exceeds all bounded test/cleanup/upload steps so
    # diagnostics are not cut off by the job timeout after a test timeout.
    timeout-minutes: 55
    env:
      GITFERRY_IT_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
      GITFERRY_IT_PROJECT: gitferry-it-gha-${{ github.run_id }}-${{ github.run_attempt }}
      GITFERRY_IT_RUNTIME_IMAGE: gitferry-it-runtime:gha-${{ github.run_id }}-${{ github.run_attempt }}
      GITFERRY_CI_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13.9"
          cache: pip
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Set up project
        run: make setup
      - name: Install integration browser runtime
        run: cd frontend && npx playwright install --with-deps chromium
      - name: Run integration doctor
        run: make doctor
      - name: Run Gitea integration
        timeout-minutes: ${{ (github.event_name == 'workflow_dispatch' && inputs.inject_integration_timeout) && 5 || 20 }}
        env:
          GITFERRY_IT_INJECT_FAILURE: ${{ (github.event_name == 'workflow_dispatch' && inputs.inject_integration_timeout) && 'timeout-after-environment-start' || (github.event_name == 'workflow_dispatch' && inputs.inject_integration_failure) && 'after-environment-start' || '' }}
          GITFERRY_IT_INJECT_TIMEOUT_SECONDS: ${{ (github.event_name == 'workflow_dispatch' && inputs.inject_integration_timeout) && '30' || '' }}
        run: make test-integration
      - name: Run historical-source compatibility probe
        if: ${{ success() && !(github.event_name == 'workflow_dispatch' && inputs.inject_integration_failure) && !(github.event_name == 'workflow_dispatch' && inputs.inject_integration_timeout) }}
        timeout-minutes: 5
        run: make test-gitea-upgrade
      - name: Run integration failure contract
        if: ${{ success() && !(github.event_name == 'workflow_dispatch' && inputs.inject_integration_failure) && !(github.event_name == 'workflow_dispatch' && inputs.inject_integration_timeout) }}
        timeout-minutes: 10
        run: make test-integration-failure-contract
      - name: Capture final workflow diagnostics
        if: always()
        timeout-minutes: 3
        run: make test-integration-diagnostics
      - name: Clean integration resources
        id: cleanup
        if: always()
        timeout-minutes: 5
        run: |
          set +e
          make test-clean
          cleanup_status=$?
          echo "exit_code=$cleanup_status" >> "$GITHUB_OUTPUT"
          exit "$cleanup_status"
      - name: Record workflow cleanup result
        if: always()
        timeout-minutes: 3
        env:
          CLEANUP_EXIT_CODE: ${{ steps.cleanup.outputs.exit_code || '125' }}
        run: |
          found=0
          record_status=0
          for results in integration-results integration-failure-results; do
            if [ -d "$results" ]; then
              found=1
              .venv/bin/python tests/integration/report_contract.py \
                record-workflow-cleanup --results "$results" \
                --cleanup-status "$CLEANUP_EXIT_CODE" || record_status=$?
            fi
          done
          if [ "$found" -eq 0 ]; then
            exit 1
          fi
          exit "$record_status"
      - name: Stage safe integration diagnostics
        if: always()
        timeout-minutes: 2
        run: |
          .venv/bin/python tests/integration/stage_artifacts.py \
            --results-root . --output integration-artifacts
      - name: Upload integration results
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitferry-integration-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: integration-artifacts/
          if-no-files-found: error
          retention-days: 14
