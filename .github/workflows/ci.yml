name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      inject_integration_failure:
        description: Inject a deterministic integration failure after environment startup
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13.9"
          cache: pip
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Set up project
        run: make setup
      - name: Run unit tests
        run: make test
      - name: Build container
        run: make container-build

  gitea-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GITFERRY_IT_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13.9"
          cache: pip
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Set up project
        run: make setup
      - name: Run integration doctor
        run: make doctor
      - name: Run Gitea integration
        env:
          GITFERRY_IT_INJECT_FAILURE: ${{ (github.event_name == 'workflow_dispatch' && inputs.inject_integration_failure) && 'after-environment-start' || '' }}
        run: make test-integration
      - name: Run integration failure contract
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.inject_integration_failure) }}
        run: make test-integration-failure-contract
      - name: Clean integration resources
        if: always()
        run: make test-clean
      - name: Upload integration results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitferry-integration-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            integration-results/
            integration-failure-results/
          if-no-files-found: error
          retention-days: 14
