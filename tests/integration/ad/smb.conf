[global]
  workgroup = SYNTH
  realm = SYNTH.AD
  netbios name = SYNTHDC
  server role = active directory domain controller
  dns forwarder = 8.8.8.8
  tls enabled = yes
  tls cafile = /run/ad-ca/ca.pem
  tls certfile = /run/ad-ca/server.pem
  tls keyfile = /run/ad-ca/server.key
  ldap server require strong auth = yes
  log level = 1

