include         /etc/ldap/schema/core.schema
include         /etc/ldap/schema/cosine.schema
include         /etc/ldap/schema/inetorgperson.schema
include         /etc/ldap/schema/nis.schema
pidfile         /run/slapd/slapd.pid
argsfile        /run/slapd/slapd.args
modulepath      /usr/lib/ldap
moduleload      back_mdb
TLSCACertificateFile /run/directory-ca/ca.pem
TLSCertificateFile /run/directory-ca/server.pem
TLSCertificateKeyFile /run/directory-ca/server.key
database        mdb
suffix          "dc=example,dc=invalid"
rootdn          "cn=admin,dc=example,dc=invalid"
rootpw          REPLACE_AT_START
directory       /var/lib/ldap
index           objectClass eq
index           uid,mail eq
access to attrs=userPassword
    by anonymous auth
    by self write
    by users none
    by * none
access to *
    by users read
    by anonymous read
    by * none
