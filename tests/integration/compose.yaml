services:
  source:
    image: docker.gitea.com/gitea:1.27.2@sha256:d20286ca2b2e170fdf628e7231b8a31a3220ade39ff462b55041d43d1fc757dd
    environment: &gitea-environment
      GITEA__database__DB_TYPE: sqlite3
      GITEA__database__PATH: /data/gitea/gitea.db
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__server__DISABLE_SSH: "true"
      GITEA__server__HTTP_PORT: "3000"
      GITEA__server__OFFLINE_MODE: "true"
      GITEA__server__ROOT_URL: http://source:3000/
      GITEA__log__MODE: console
      GITEA__log__LEVEL: warn
    ports:
      - "127.0.0.1:${GITFERRY_IT_SOURCE_PORT:-33001}:3000"
    volumes:
      - source-data:/data
    networks:
      - control-net
      - source-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/v1/version"]
      interval: 2s
      timeout: 2s
      retries: 60

  target:
    image: docker.gitea.com/gitea:1.27.2@sha256:d20286ca2b2e170fdf628e7231b8a31a3220ade39ff462b55041d43d1fc757dd
    environment:
      <<: *gitea-environment
      GITEA__server__ROOT_URL: http://target:3000/
      SSL_CERT_FILE: /run/directory-ca/ca.pem
      GITEA__migrations__ALLOWED_DOMAINS: source
      GITEA__migrations__ALLOW_LOCALNETWORKS: "true"
    ports:
      - "127.0.0.1:${GITFERRY_IT_TARGET_PORT:-33002}:3000"
    volumes:
      - target-data:/data
      - directory-ca:/run/directory-ca:ro
    networks:
      - control-net
      - target-net
    depends_on:
      openldap:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/v1/version"]
      interval: 2s
      timeout: 2s
      retries: 60

  openldap:
    build:
      context: ./directory
    volumes:
      - directory-ca:/run/directory-ca
      - directory-data:/var/lib/ldap
    networks:
      - target-net
    healthcheck:
      test: ["CMD", "ldapsearch", "-x", "-H", "ldap://127.0.0.1:389", "-b", "", "-s", "base", "namingContexts"]
      interval: 2s
      timeout: 2s
      retries: 60

  ad:
    build:
      context: ./ad
    hostname: synthdc
    environment:
      AD_ADMIN_PASSWORD: Synthetic-Admin-Only-42!
      PYTHONPATH: /opt/gitferry-backend
    volumes:
      - ../../backend/src:/opt/gitferry-backend:ro
    networks:
      target-net:
        aliases: [synthdc]
    healthcheck:
      test: ["CMD-SHELL", "openssl s_client -connect 127.0.0.1:636 -CAfile /run/ad-ca/ca.pem -verify_return_error </dev/null 2>/dev/null | grep -q 'Verify return code: 0'"]
      interval: 2s
      timeout: 3s
      retries: 30
    stop_grace_period: 5s

  importer:
    image: docker.gitea.com/gitea:1.27.2@sha256:d20286ca2b2e170fdf628e7231b8a31a3220ade39ff462b55041d43d1fc757dd
    entrypoint: ["/bin/sh", "-c"]
    command: ["sleep infinity"]
    volumes:
      - ../../integration-results/package:/package:ro
    networks:
      - target-net
    depends_on:
      target:
        condition: service_healthy

  gitferry-a:
    build:
      context: ../..
      dockerfile: containers/gitferry.Dockerfile
      args:
        GITFERRY_VERSION: ${GITFERRY_VERSION:-0.3.0rc1}
        GITFERRY_SOURCE_REVISION: ${GITFERRY_SOURCE_REVISION:-unknown}
    image: ${GITFERRY_IT_RUNTIME_IMAGE:-gitferry-it-runtime:dev}
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["sleep infinity"]
    healthcheck:
      disable: true
    environment:
      GITFERRY_SIDE: A
      GITFERRY_GITEA_URL: http://source:3000
      GITFERRY_IT_USER_PASSWORD: ${GITFERRY_IT_USER_PASSWORD}
      GITFERRY_IT_INSTANCE_NONCE: ${GITFERRY_IT_INSTANCE_NONCE}
    volumes:
      - gitferry-a-state:/state
      - ./transport_worker.py:/probe/transport_worker.py:ro
      - ./comment_transport_worker.py:/probe/comment_transport_worker.py:ro
    networks:
      - source-net
    depends_on:
      source:
        condition: service_healthy

  directory-bootstrap:
    image: ${GITFERRY_IT_RUNTIME_IMAGE:-gitferry-it-runtime:dev}
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["sleep infinity"]
    healthcheck:
      disable: true
    environment:
      USER: git
      GITEA_CUSTOM: /data/gitea
      GITEA_WORK_DIR: /data/gitea
    volumes:
      - target-data:/data
      - directory-ca:/run/directory-ca:ro
      - directory-bootstrap-state:/state
      - ./directory_bootstrap_worker.py:/probe/directory_bootstrap_worker.py:ro
    networks:
      - target-net
    depends_on:
      target:
        condition: service_healthy

  directory-claims:
    image: ${GITFERRY_IT_RUNTIME_IMAGE:-gitferry-it-runtime:dev}
    entrypoint: ["/bin/sh", "-c"]
    command: ["sleep infinity"]
    healthcheck:
      disable: true
    volumes:
      - directory-ca:/run/directory-ca:ro
      - ./directory_claim_worker.py:/probe/directory_claim_worker.py:ro
    networks: [target-net]
    depends_on:
      openldap:
        condition: service_healthy

  gitferry-b:
    build:
      context: ../..
      dockerfile: containers/gitferry.Dockerfile
      args:
        GITFERRY_VERSION: ${GITFERRY_VERSION:-0.3.0rc1}
        GITFERRY_SOURCE_REVISION: ${GITFERRY_SOURCE_REVISION:-unknown}
    image: ${GITFERRY_IT_RUNTIME_IMAGE:-gitferry-it-runtime:dev}
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["sleep infinity"]
    healthcheck:
      disable: true
    environment:
      GITFERRY_SIDE: B
      GITFERRY_GITEA_URL: http://target:3000
      GITFERRY_IT_USER_PASSWORD: ${GITFERRY_IT_USER_PASSWORD}
      GITFERRY_IT_ADMIN_PASSWORD: ${GITFERRY_IT_ADMIN_PASSWORD}
      GITFERRY_IT_DIRECTORY_PASSWORD: synthetic-directory-pass
      GITFERRY_IT_INSTANCE_NONCE: ${GITFERRY_IT_INSTANCE_NONCE}
    volumes:
      - gitferry-b-state:/state
      - directory-ca:/run/directory-ca:ro
      - ./transport_worker.py:/probe/transport_worker.py:ro
      - ./comment_transport_worker.py:/probe/comment_transport_worker.py:ro
      - ./provisioning_worker.py:/probe/provisioning_worker.py:ro
      - ./plan_worker.py:/probe/plan_worker.py:ro
      - ../../integration-results/package:/package:ro
    networks:
      - target-net
    depends_on:
      target:
        condition: service_healthy

volumes:
  directory-bootstrap-state:
  directory-ca:
  directory-data:
  source-data:
  target-data:
  gitferry-a-state:
  gitferry-b-state:

networks:
  control-net:
  target-net:
    internal: true
  source-net:
    internal: true
